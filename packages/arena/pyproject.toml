[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "doa-arena"
version = "0.1.0"
description = "DOA Estimation Algorithm Arena - Core Library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DOA Research Lab"}
]
dependencies = [
    "doa-arena-api==1.0.0",
    "numpy>=1.24,<3.0",
    "scipy>=1.10",
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "filelock>=3.12",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0",
]
server = [
    "fastapi>=0.100",
    "uvicorn[standard]>=0.23",
    "psutil>=5.9",
]
docx = [
    "python-docx>=0.8",
]
plot = [
    "plotly>=5.0",
    "kaleido>=0.2",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "ruff>=0.1.0",
]
all = [
    "doa-arena[torch,server,docx,plot,dev]",
]

[project.scripts]
arena = "arena.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
arena = ["py.typed", "templates/**/*", "benchmarks/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "gpu: marks tests as requiring GPU",
    "matlab: marks tests as requiring MATLAB",
]

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
exclude = ["build", "dist", "tests"]
