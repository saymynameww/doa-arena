name: M1-M5 acceptance
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  linux-python310:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -e packages/arena_api -e 'packages/arena[dev,server,plot]' httpx
      - run: python -c "import kaleido; kaleido.get_chrome_sync()"
      - run: python -m pytest -q --junitxml=acceptance.xml
      - run: python -m mypy packages
      - run: python scripts/generate_api_types.py --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-python310-results
          path: acceptance.xml
